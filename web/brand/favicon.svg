<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="vpIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <linearGradient id="vpBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF0080" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="30" fill="#070A12"/>
  <rect width="124" height="124" x="2" y="2" rx="29" fill="none" stroke="url(#vpBorderGrad)" stroke-width="2"/>
  <!-- Central Pulse Blade Mark -->
  <g filter="url(#neonGlow)">
    <path d="M26 64 L42 64 L52 28 L66 100 L80 44 L90 64 L104 64" fill="none" stroke="url(#vpIconGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="28" r="4.5" fill="#00F2FE"/>
    <circle cx="66" cy="100" r="4.5" fill="#FF0080"/>
  </g>
</svg>