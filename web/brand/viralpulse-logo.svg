<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96" fill="none">
  <defs>
    <linearGradient id="logoPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF0080"/>
    </linearGradient>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Icon Mark -->
  <g transform="translate(8, 10)">
    <rect width="76" height="76" rx="20" fill="#0C101D" stroke="#1F293D" stroke-width="1.5"/>
    <rect width="74" height="74" x="1" y="1" rx="19" fill="none" stroke="url(#logoPulseGrad)" stroke-width="1" stroke-opacity="0.4"/>
    <g filter="url(#logoGlow)">
      <path d="M14 38 L25 38 L32 18 L41 58 L48 28 L54 38 L62 38" fill="none" stroke="url(#logoPulseGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="18" r="3" fill="#00F2FE"/>
      <circle cx="41" cy="58" r="3" fill="#FF0080"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(100, 0)">
    <text x="0" y="47" font-family="'Geist', 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="1.2" fill="url(#logoTextGrad)">VIRALPULSE</text>
    <g transform="translate(0, 58)">
      <rect x="0" y="0" width="86" height="20" rx="6" fill="url(#logoPulseGrad)"/>
      <text x="43" y="14" font-family="'Geist', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#FFFFFF" text-anchor="middle">AI STUDIO</text>
      <text x="96" y="14" font-family="'Geist', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8" fill="#94A3B8">BY MASRUR SIAM</text>
    </g>
  </g>
</svg>